name: Supabase Keepalive

# Keeps the free-tier Supabase project active (it pauses after 7 days without
# activity). Runs on GitHub, independent of any server. GitHub emails you when
# this job FAILS, so you know before the database goes to sleep.
#
# Needs two repo secrets: SUPABASE_URL and SUPABASE_KEY (the service role key —
# the tables have RLS without policies, so the publishable key sees nothing).

on:
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC (~09:00 WIB)
  workflow_dispatch: {}

permissions:
  actions: write # needed by the "self keepalive" step below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Secret SUPABASE_URL / SUPABASE_KEY belum diset di repo."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/bills?select=id&limit=1")
            echo "Percobaan $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Keep-alive sukses."
              exit 0
            fi
            [ "$i" -lt 5 ] && sleep 15
          done
          echo "::error::Keep-alive GAGAL setelah 5 percobaan (HTTP terakhir: $code)."
          exit 1

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Calling /enable every day resets that counter without needing a commit.
      - name: Cegah workflow di-disable GitHub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" --silent; then
            echo "Workflow di-refresh (anti auto-disable)."
          else
            echo "::warning::Gagal refresh workflow, cek permission actions:write."
          fi
